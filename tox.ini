[tox]
min_version = 4.11
requires =
    tox-gh-actions>=3
envlist =
    python{3.11,3.12,3.13}-django5.2-wagtail{7.0,7.2,7.4,8.0}-{sqlite,postgres}
    python{3.12,3.13}-django6.0-wagtail7.2-{sqlite,postgres}
    pyright
skip_missing_interpreters = true

[gh-actions]
python =
    3.11: python3.11
    3.12: python3.12
    3.13: python3.13

[gh-actions:env]
DB =
    sqlite: sqlite
    postgres: postgres

[testenv]
package = editable
extras = test
commands = pytest -n auto --cov {posargs: -vv}

base_python =
    python3.11: python3.11
    python3.12: python3.12
    python3.13: python3.13

# Pass the pins below as constraints to the package-dependency install, which tox
# resolves separately. Without this defined, dependencies can silently resolve
# to something else.
constrain_package_deps = true

deps =
    django5.2: Django>=5.2,<5.3
    django6.0: Django>=6.0,<6.1

    wagtail7.0: wagtail>=7.0,<7.1
    wagtail7.2: wagtail>=7.2,<7.3
    wagtail7.4: wagtail>=7.4,<7.5
    wagtail8.0: wagtail>=8.0,<8.1

    postgres: psycopg2>=2.9

setenv =
    postgres: DATABASE_URL={env:DATABASE_URL:postgres:///wagtail_localize_smartling}

[testenv:pyright]
allowlist_externals =
    pyright
commands = pyright {posargs}
